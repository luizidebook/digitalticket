openapi: 3.0.3
info:
  title: DigitalTicket API
  version: 0.1.0
  description: >-
    API multi-tenant para eventos, ingressos, pagamentos, check-in,
    relatórios, cupons e white-label. Valores monetários são expressos em
    centavos de BRL.
servers:
  - url: http://localhost:4000
    description: Desenvolvimento local
  - url: https://api.example.com
    description: Produção (configure o domínio real)
tags:
  - name: Auth
    description: Autenticação e sessão
  - name: Events
    description: Eventos, datas e lotes
  - name: Orders
    description: Pedidos e pagamentos
  - name: Check-in
    description: Validação de ingressos
  - name: Management
    description: Operação do organizador
  - name: Admin
    description: Operação de super-admin
  - name: Reports
    description: Métricas e exportações
  - name: Branding
    description: White-label por tenant
paths:
  /health:
    get:
      tags: [Auth]
      summary: Health check
      responses:
        '200':
          description: API disponível
  /api/v1:
    get:
      tags: [Auth]
      summary: Lista módulos da API
      responses:
        '200':
          description: Módulos disponíveis
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Cadastra comprador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201': { description: Usuário criado }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Autentica usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200': { description: Tokens e usuário }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotaciona refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200': { description: Novos tokens }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Encerra sessão
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Sessão encerrada }
  /api/v1/events:
    get:
      tags: [Events]
      summary: Lista eventos da organização
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Eventos com datas e lotes }
    post:
      tags: [Events]
      summary: Cria evento
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '201': { description: Evento criado }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Events]
      summary: Detalha evento
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Evento com datas e lotes }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Events]
      summary: Atualiza evento
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '200': { description: Evento atualizado }
  /api/v1/events/{eventId}/dates:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      tags: [Events]
      summary: Adiciona data/sessão ou produto sem data
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventDateInput' }
      responses:
        '201': { description: Data criada }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/events/{eventId}/dates/{dateId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/DateId'
    patch:
      tags: [Events]
      summary: Atualiza data
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventDateInput' }
      responses:
        '200': { description: Data atualizada }
    delete:
      tags: [Events]
      summary: Remove ou desativa data
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Data removida }
        '200': { description: Data desativada por possuir lotes }
  /api/v1/events/{eventId}/lots:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      tags: [Events]
      summary: Cria lote
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LotInput' }
      responses:
        '201': { description: Lote criado }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/events/{eventId}/lots/{lotId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/LotId'
    patch:
      tags: [Events]
      summary: Atualiza lote e capacidade
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LotInput' }
      responses:
        '200': { description: Lote atualizado }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Events]
      summary: Remove ou desativa lote
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Lote removido }
        '200': { description: Lote desativado por possuir vendas }
  /api/v1/events/{eventId}/publish:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      tags: [Events]
      summary: Publica evento
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Evento publicado }
  /api/v1/public/events/{organizationSlug}/{eventSlug}:
    get:
      tags: [Events]
      summary: Consulta evento público com datas e lotes
      parameters:
        - { name: organizationSlug, in: path, required: true, schema: { type: string } }
        - { name: eventSlug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Evento público }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/orders:
    post:
      tags: [Orders]
      summary: Cria pedido e reserva estoque
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderInput' }
      responses:
        '201': { description: Pedido criado }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/orders/{orderId}:
    get:
      tags: [Orders]
      summary: Consulta pedido
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200': { description: Pedido }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/orders/{orderId}/payment:
    post:
      tags: [Orders]
      summary: Cria pagamento PIX ou cartão Mercado Pago
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentInput' }
      responses:
        '200': { description: Pagamento criado }
        '400': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /api/webhooks/mercado-pago:
    post:
      tags: [Orders]
      summary: Webhook autenticado e idempotente do Mercado Pago
      parameters:
        - { name: x-signature, in: header, required: true, schema: { type: string } }
        - { name: x-request-id, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Webhook recebido/processado }
        '202': { description: Recebido, reconciliação pendente }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/check-in/catalog:
    get:
      tags: [Check-in]
      summary: Baixa catálogo de ingressos para cache offline e busca manual
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: eventId, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 2000, default: 500 } }
      responses:
        '200': { description: Ingressos com hash QR e status }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/check-in/stats:
    get:
      tags: [Check-in]
      summary: Retorna entradas versus total vendido
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: eventId, in: query, schema: { type: string } }
      responses:
        '200': { description: Estatísticas em tempo real }
  /api/v1/check-in/history:
    get:
      tags: [Check-in]
      summary: Lista o histórico do operador autenticado
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200': { description: Leituras recentes }
  /api/v1/check-in/validate:
    post:
      tags: [Check-in]
      summary: Valida QR Code/código e registra entrada
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckInInput' }
      responses:
        '200': { description: Check-in aprovado }
        '409': { description: Ingresso já utilizado }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/manage/orders:
    get:
      tags: [Management]
      summary: Lista pedidos do organizador
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Search' }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200': { description: Pedidos paginados }
  /api/v1/manage/orders/{orderId}/send-whatsapp:
    post:
      tags: [Management]
      summary: Envia códigos dos ingressos por WhatsApp Cloud API
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WhatsAppInput' }
      responses:
        '200': { description: Mensagem enviada }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/manage/customers:
    get:
      tags: [Management]
      summary: Lista clientes
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Clientes paginados }
  /api/v1/manage/coupons:
    get:
      tags: [Management]
      summary: Lista cupons
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Cupons }
    post:
      tags: [Management]
      summary: Cria cupom
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CouponInput' }
      responses:
        '201': { description: Cupom criado }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/manage/coupons/{couponId}:
    parameters:
      - $ref: '#/components/parameters/CouponId'
    patch:
      tags: [Management]
      summary: Atualiza cupom, limite, vigência ou status
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CouponInput' }
      responses:
        '200': { description: Cupom atualizado }
    delete:
      tags: [Management]
      summary: Remove ou desativa cupom
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Cupom removido }
  /api/v1/public/coupons/validate:
    post:
      tags: [Management]
      summary: Valida cupom no checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, code, subtotalCents]
              properties:
                organizationId: { type: string }
                code: { type: string }
                subtotalCents: { type: integer, minimum: 0 }
      responses:
        '200': { description: Resultado da validação }
  /api/v1/reports/summary:
    get:
      tags: [Reports]
      summary: Resumo financeiro e operacional
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: KPIs consolidados }
  /api/v1/reports/events:
    get:
      tags: [Reports]
      summary: Métricas por evento
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Métricas }
  /api/v1/reports/orders.csv:
    get:
      tags: [Reports]
      summary: Exporta pedidos CSV
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Arquivo CSV
          content:
            text/csv:
              schema: { type: string, format: binary }
  /api/v1/reports/customers.csv:
    get:
      tags: [Reports]
      summary: Exporta clientes CSV
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Arquivo CSV
          content:
            text/csv:
              schema: { type: string, format: binary }
  /api/v1/reports/tickets.csv:
    get:
      tags: [Reports]
      summary: Exporta ingressos CSV
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Arquivo CSV
          content:
            text/csv:
              schema: { type: string, format: binary }
  /api/v1/tenant/branding:
    get:
      tags: [Branding]
      summary: Consulta branding do tenant
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Branding }
    patch:
      tags: [Branding]
      summary: Atualiza logo, domínio e cores
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrandingInput' }
      responses:
        '200': { description: Branding atualizado }
  /api/v1/public/tenants/resolve:
    get:
      tags: [Branding]
      summary: Resolve tenant por slug ou domínio
      parameters:
        - { name: slug, in: query, schema: { type: string } }
        - { name: host, in: query, schema: { type: string } }
      responses:
        '200': { description: Tenant resolvido }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/public/tenants/{slug}:
    get:
      tags: [Branding]
      summary: Página pública white-label do tenant
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Tenant e eventos publicados }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/admin/overview:
    get:
      tags: [Admin]
      summary: Visão consolidada do super-admin
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: KPIs consolidados }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/admin/organizations:
    get:
      tags: [Admin]
      summary: Lista organizações
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Organizações }
    post:
      tags: [Admin]
      summary: Cria organização
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationInput' }
      responses:
        '201': { description: Organização criada }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT retornado por /api/v1/auth/login
  responses:
    Error:
      description: Erro da API
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    EventId: { name: eventId, in: path, required: true, schema: { type: string } }
    DateId: { name: dateId, in: path, required: true, schema: { type: string } }
    LotId: { name: lotId, in: path, required: true, schema: { type: string } }
    OrderId: { name: orderId, in: path, required: true, schema: { type: string } }
    CouponId: { name: couponId, in: path, required: true, schema: { type: string } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Search: { name: search, in: query, schema: { type: string } }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        details: { type: object, additionalProperties: true }
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        phone: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    EventInput:
      type: object
      required: [name, slug, type]
      properties:
        name: { type: string }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        type: { type: string }
        category: { type: string }
        description: { type: string }
        imageUrl: { type: string, format: uri }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
    EventDateInput:
      type: object
      properties:
        label: { type: string, nullable: true }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
        sortOrder: { type: integer, minimum: 0 }
        active: { type: boolean }
    LotInput:
      type: object
      required: [name, priceInCents, capacity]
      properties:
        name: { type: string }
        priceInCents: { type: integer, minimum: 0, example: 9900 }
        capacity: { type: integer, minimum: 1 }
        maxPerOrder: { type: integer, minimum: 1, maximum: 50 }
        eventDateId: { type: string, nullable: true }
    OrderInput:
      type: object
      required: [organizationId, eventId, buyerId, lines]
      properties:
        organizationId: { type: string }
        eventId: { type: string }
        buyerId: { type: string }
        couponCode: { type: string }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [lotId, quantity]
            properties:
              lotId: { type: string }
              quantity: { type: integer, minimum: 1 }
    PaymentInput:
      type: object
      required: [method]
      properties:
        method: { type: string, enum: [PIX, CREDIT_CARD] }
        card:
          type: object
          properties:
            token: { type: string }
            installments: { type: integer }
            paymentMethodId: { type: string }
    CheckInInput:
      type: object
      properties:
        signedToken: { type: string }
        checkInCode: { type: string }
        ticketId: { type: string }
    CouponInput:
      type: object
      required: [code]
      properties:
        code: { type: string }
        percentageOff: { type: integer, minimum: 1, maximum: 100, nullable: true }
        fixedOffCents: { type: integer, minimum: 1, nullable: true }
        maxUses: { type: integer, minimum: 1, nullable: true }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
        active: { type: boolean }
    WhatsAppInput:
      type: object
      required: [phone]
      properties:
        phone: { type: string, example: '+55 71 99999-1234' }
    BrandingInput:
      type: object
      properties:
        domain: { type: string, nullable: true }
        logoUrl: { type: string, format: uri, nullable: true }
        primaryColor: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        accentColor: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
    OrganizationInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string }
        domain: { type: string, nullable: true }
        primaryColor: { type: string }
        accentColor: { type: string }
