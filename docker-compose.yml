services:
  postgres:
    image: postgres:16-alpine
    container_name: digitalticket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: digitalticket
      POSTGRES_USER: digitalticket
      POSTGRES_PASSWORD: digitalticket_dev
    ports:
      - "5432:5432"
    volumes:
      - digitalticket_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digitalticket -d digitalticket"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  digitalticket_pgdata:

